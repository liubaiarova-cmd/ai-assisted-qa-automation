name: Test generation

on:
  schedule:
    # 06:00 UTC, Monday–Friday
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DIDAXIS_URL: ${{ secrets.DIDAXIS_URL }}
      DIDAXIS_EMAIL: ${{ secrets.DIDAXIS_EMAIL }}
      DIDAXIS_PASSWORD: ${{ secrets.DIDAXIS_PASSWORD }}
      DIDAXIS_API_TOKEN: ${{ secrets.DIDAXIS_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Install Cursor CLI
        run: |
          curl https://cursor.com/install -fsS | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Ticket work only. Do NOT run the full suite here — agent shell tools get
      # SIGTERM (~exit 143) on long Playwright runs inside `agent -p`.
      - name: Work In Progress ticket backlog
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          agent -p --force --trust --output-format text "$(cat <<'EOF'
          Backlog mode — Section A only. This workflow is the external trigger. Follow .cursor/rules/qa-orchestration.mdc.

          Shared heal budget for this whole workflow run: at most 5 self-heals (shared with the later suite-heal step). Never merge a PR. Never weaken, delete, or rewrite an assertion to get green.

          Work DS tickets in status "In Progress" that do not have the tests-generated label. Take at most 5 tickets, lowest key first.

          For each ticket:
          1. Analyze the ticket, including live UI recon when DIDAXIS_EMAIL and DIDAXIS_PASSWORD are set.
          2. Write a conforming Playwright spec under tests/. Page objects and fixtures only under pages/ and fixtures/. Do not edit application source.
          3. Run ONLY that ticket's new/changed spec with npx playwright test <spec> (never the full suite).
          4. If red: triage first (ci-failure-triage). Then Heal on red:
             - Locator drift (test issue): apply self-heal — re-discover via agent-browser a11y snapshot (fallback: Playwright CLI), patch one locator in pages/ only, prove green with assertions unchanged (git diff -- tests/ must show no assertion edits), open one unmerged repair PR linked to the run/ticket.
             - Real app bug: do NOT heal and do NOT file a Jira bug in this run (human must confirm first). Note the diagnosis on the ticket PR.
             - Other test issue (wrong assertion, wait, flake, not drift): do NOT self-heal; leave the PR unmerged with the diagnosis and move on.
          5. If the same failing spec is still red after triage/heal attempts (loop guard: never re-run the same failing spec more than twice), stop that ticket and move on.
          6. Open one pull request linked to the ticket for the generated tests. Put the DS key in the title and body. Heal repairs may be a separate unmerged PR per self-heal.
          7. Add the tests-generated label on the Jira ticket so the next run skips it (even if the suite stayed red after triage/heal budget).

          If the ticket queue is empty, exit immediately after reporting Eligible count: 0. Do not run the full Playwright suite — the next workflow step does that outside the agent.

          Never close or transition the ticket. A human approves every merge and every filed bug.

          Use ATLASSIAN_EMAIL and ATLASSIAN_API_TOKEN for Jira Cloud REST (not browser login). Use GITHUB_TOKEN for git and pull requests.
          EOF
          )"

      # Full suite runs in Actions so the agent is not killed mid-suite (exit 143 / SIGTERM).
      - name: Run Playwright suite
        id: suite
        run: |
          set -o pipefail
          if npx playwright test 2>&1 | tee suite-run.log; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            suite-run.log
          retention-days: 7
          if-no-files-found: warn

      - name: Self-heal locator drift from suite failures
        if: ${{ steps.suite.outputs.conclusion == 'failure' }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          agent -p --force --trust --output-format text "$(cat <<'EOF'
          Backlog mode — Section B only (suite self-heal). Follow .cursor/rules/qa-orchestration.mdc and .cursor/skills/self-heal/SKILL.md.

          The full Playwright suite already ran in this GitHub Actions job. Do NOT run `npx playwright test` with no file filter (that caused CI exit 143 / SIGTERM). Use the existing failure evidence instead.

          Inputs in the workspace:
          - suite-run.log — full suite console output
          - playwright-report/ — HTML report when present

          Shared heal budget for this whole workflow run: at most 5 self-heals. Never merge a PR. Never weaken, delete, or rewrite an assertion to get green.

          Required steps:
          1. Read suite-run.log (and the report if needed). List failing specs/titles.
          2. For each red failure (until the shared heal budget of 5 is used): triage with ci-failure-triage.
          3. Locator drift only: apply self-heal per .cursor/skills/self-heal/SKILL.md — re-discover via agent-browser a11y snapshot, patch one locator in pages/ only, prove green by re-running ONLY that failing test (`npx playwright test <spec> -g "<title>"`), confirm assertions unchanged (`git diff -- tests/` must show no assertion edits), open one unmerged repair PR linked to run $GITHUB_RUN_URL. One locator per heal; leave further drift for the next trigger.
          4. Real app bug or non-drift test issue: do NOT heal and do NOT file a Jira bug in this run; note the diagnosis and continue.
          5. Loop guard: never re-run the same failing spec more than twice after triage/heal.

          Use GITHUB_TOKEN for git and pull requests.
          EOF
          )"
